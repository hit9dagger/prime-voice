name: Android APK
on:
  pull_request:
  push:
    branches: [main, codex/prime-sync]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Verify official Gradle wrapper
        run: |
          printf '%s  %s\n' '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046' 'gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-provider: basic
          cache-disabled: true
          dependency-graph: disabled
          build-scan-publish: false
      - name: Google Translate attribution asset
        run: python3 scripts/prepare_attribution.py
      - name: Unit tests, Android lint and APK
        run: bash ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify native libraries and APK signature
        run: |
          python3 scripts/check_native_alignment.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare downloads
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PRIME-VOICE-debug-arm64.apk
          git archive --format=zip --output=dist/PRIME-VOICE-source.zip HEAD
          zip -q dist/PRIME-VOICE-source.zip app/src/main/res/drawable/google_translate_attribution.png
          sha256sum dist/PRIME-VOICE-debug-arm64.apk > dist/SHA256SUMS.txt
          git rev-parse HEAD > dist/SOURCE-COMMIT.txt
      - name: APK for Android phone
        id: apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: dist/PRIME-VOICE-debug-arm64.apk
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Complete Android Studio source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: dist/PRIME-VOICE-source.zip
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checks-and-reports
          path: |
            app/build/reports/
            app/build/test-results/
            dist/SHA256SUMS.txt
            dist/SOURCE-COMMIT.txt
          retention-days: 7
          if-no-files-found: warn
      - name: Phone download link
        if: success()
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          printf '### PRIME VOICE APK\n\n[Stáhnout instalační APK](%s)\n\nPřihlaste se ke GitHubu. Soubor je dostupný 7 dní. Podpis je vývojový; další sestavení může vyžadovat odinstalaci předchozí verze.\n' "$APK_URL" >> "$GITHUB_STEP_SUMMARY"
