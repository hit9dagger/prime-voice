name: PRIME VOICE CAMERA 2.0 APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camera-2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Tests, lint, optimized APK and Android tests
        run: ./gradlew :core:test :app:lintRelease :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Prepare verified download files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-universal-release.apk dist/PRIME-VOICE-CAMERA-2.0.0.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/PRIME-VOICE-CAMERA-2.0.0-arm64.apk
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          done
          git archive --format=zip --prefix=PRIME-VOICE-CAMERA/ HEAD > dist/PRIME-VOICE-CAMERA-2.0.0-zdroje.zip
          zip -qr dist/PRIME-VOICE-CAMERA-2.0.0-testy.zip core/build/reports/tests/test app/build/reports/lint-results-release.html docs/model-validation
          cp README.md dist/PRIME-VOICE-CAMERA-navod.md
          (cd dist && sha256sum *.apk *.zip *.md > SHA256SUMS.txt)
          cat > dist/release-notes.md <<'NOTES'
          ## Instalace
          **[Stáhnout univerzální PRIME VOICE CAMERA 2.0](https://github.com/hit9dagger/prime-voice/releases/download/prime-voice-camera-v2.0.0/PRIME-VOICE-CAMERA-2.0.0.apk)**

          **[Menší APK pro POCO F7 Ultra a další ARM64 telefony](https://github.com/hit9dagger/prime-voice/releases/download/prime-voice-camera-v2.0.0/PRIME-VOICE-CAMERA-2.0.0-arm64.apk)**

          Odkaz otevřete přímo v aplikaci Chrome. Po stažení otevřete APK a zvolte Instalovat. Pokud Android hlásí konflikt podpisu se starší testovací verzí, je nutná její odinstalace; tím se odstraní její nastavení a stažená data. Jde o optimalizované testovací APK podepsané vývojovým klíčem.

          ## Co funguje a co je podmíněné
          - LIGHT: úsporný kamerový překlad pro 4GB telefony, offline ML Kit EN→CS a české Android TTS. Při prvním použití stáhněte překladový model a český hlas.
          - STANDARD: používá ML Kit. Menší model Qwen3 0.6B při skutečném testu přes LiteRT-LM 0.16.1 na Linuxu nepřekládal správně do češtiny; jeho aktivace je blokovaná.
          - ULTRA: integrovaný LiteRT-LM pro Gemma 3n E2B. Model se importuje samostatně z oficiálního zdroje po přijetí podmínek vydavatele. Aktivuje se až po ověření souboru, paměti, skutečného načtení a dvou českých překladů na telefonu. Gemma nebyla otestována na fyzickém Android zařízení a není zde vydávána za ověřený režim.
          - Jedna OCR/překladová inference, oddělený proces AI, automatický návrat do LIGHT, zachovaná fronta i rozehraná věta, všechny předchozí ovládací funkce.
          - Android 10+; pomocné on-device ASR od Androidu 12, pokud je dostupné. Univerzální APK: ARM64, ARM32, x86_64; ARM32 používá LIGHT. Velké jazykové modely nejsou v APK.

          Před zveřejněním se vyžadují unit testy, lint, ověření podpisu a zarovnání APK a instrumentované testy na Android emulátoru s 4 GB RAM. Fyzický 4GB telefon, POCO F7 Ultra, Bluetooth ani několikahodinový provoz ověřeny nebyly.

          [Zdrojový projekt a návod](https://github.com/hit9dagger/prime-voice/tree/prime-voice-camera-2.0) · [Podrobná kompatibilita a omezení](https://github.com/hit9dagger/prime-voice/blob/prime-voice-camera-2.0/docs/CAMERA-2.0.md)
          NOTES
          printf '\nCommit: %s\n' "$GITHUB_SHA" >> dist/release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: CAMERA-2-download
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-apks
          path: |
            app/build/outputs/apk/debug/app-x86_64-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-and-lint-reports
          path: |
            core/build/reports/tests/test/
            app/build/reports/lint-results-release.html
  android-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-test-apks
          path: apks
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
      - name: Real OCR, Activity and native-process tests on 4GB Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          heap-size: 256M
          disable-animations: true
          script: |
            adb install -r apks/debug/app-x86_64-debug.apk
            adb install -r apks/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r cz.primevoice.test/androidx.test.runner.AndroidJUnitRunner > emulator-results.txt
            cat emulator-results.txt
            grep -q 'OK (4 tests)' emulator-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-report
          path: emulator-results.txt
  publish:
    needs: [build, android-test]
    if: github.ref == 'refs/heads/prime-voice-camera-2.0' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CAMERA-2-download
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: android-emulator-report
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: prime-voice-camera-v2.0.0
          target_commitish: ${{ github.sha }}
          name: PRIME VOICE CAMERA 2.0 – LIGHT, STANDARD, ULTRA
          body_path: dist/release-notes.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.zip
            dist/PRIME-VOICE-CAMERA-navod.md
            dist/SHA256SUMS.txt
            dist/emulator-results.txt
