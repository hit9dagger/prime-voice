name: PRIME VOICE CAMERA 2.1.0 Android validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camera-21-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK, NDK and CMake
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Tests, lint, native APK and Android tests
        run: ./gradlew :core:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Package actual APK and reports
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-universal-debug.apk dist/PRIME-VOICE-CAMERA-2.1.0-debug.apk
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist/PRIME-VOICE-CAMERA-2.1.0-arm64-debug.apk
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          done
          git archive --format=zip --prefix=PRIME-VOICE-CAMERA/ HEAD > dist/PRIME-VOICE-CAMERA-2.1.0-zdroje.zip
          zip -qr dist/PRIME-VOICE-CAMERA-2.1.0-testy.zip core/build/reports/tests/test app/build/reports/lint-results-debug.html docs validation
          cp README.md dist/PRIME-VOICE-CAMERA-navod.md
          (cd dist && sha256sum *.apk *.zip *.md > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PRIME-VOICE-CAMERA-2.1.0-download
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-apks
          path: |
            app/build/outputs/apk/debug/app-x86_64-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-and-lint-reports
          path: |
            core/build/reports/tests/test/
            app/build/reports/lint-results-debug.html
  android-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Real Czech TTS engine for emulator only
        run: |
          curl -fL --retry 3 'https://huggingface.co/csukuangfj2/sherpa-onnx-apk/resolve/main/tts-engine-new/2.0.2/sherpa-onnx-2.0.2-x86_64-ces-tts-engine-vits-piper-cs_CZ-jirka-low.apk' -o jirka-test.apk
          echo '667dc39f8ff22b4d81ff0d30e2e36e1fe0dd06a428d25bf94bcdb79a3a707212  jirka-test.apk' | sha256sum -c -
      - uses: actions/download-artifact@v4
        with:
          name: android-test-apks
          path: apks
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Camera OCR, offline translation and Czech TTS on 4 GB Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: bash ci/android-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-report
          path: |
            emulator-results.txt
            model-preparation.txt
            emulator-logcat.txt
            translation-mlkit.tsv
